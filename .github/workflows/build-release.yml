name: Build and release Halloween Theme QMOD

on:
  push:
    branches:
      - main
      - feature/ghost-results-1.40.8
      - feature/dedicated-ghost-controller-1.40.8
      - feature/original-artwork-ghost-controller-1.40.8
      - feature/ghost-dispersion-original-sfx-1.40.8
      - feature/ghost-art-variety-1.40.8
      - feature/ghost-variety-final-four-1.40.8
      - feature/new-ghosts-only-1.40.8
      - feature/three-ghost-voices-1.40.8
      - feature/five-ghost-sounds-personal-1.40.8
      - release/v1.0.1-s-rank
      - fix/v1.0.1-ghost-sound-rotation-and-png-cleanup
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate Quest package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Generate four transparent ghost sprites
        run: |
          python3 -m pip install --break-system-packages cairosvg pillow numpy
          python3 scripts/render-ghost-sprites.py
          test -s assets/ghost_sprites.png
          for i in 0 1 2 3; do test -s "assets/ghost_single_$i.png"; done
          for i in 0 1 2 3 4 5 6 7; do test -s "assets/ghost_new_$i.png"; done

      - name: Prepare runner build tools and FFmpeg
        run: |
          for executable in cmake ninja unzip curl python3; do
            command -v "$executable" || { echo "Missing $executable on Ubuntu runner"; exit 1; }
          done
          python3 -m pip install --break-system-packages imageio-ffmpeg
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/bin/ffmpeg"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/ffmpeg" -version

      - name: Prepare three independently licensed OpenGameArt ghost recordings
        run: |
          python3 scripts/generate_original_ghost_sfx.py
          for name in ghost_ogrebane ghost_scary_1 ghost_breath; do
            test -s "FileCopies/$name.ogg"
          done

      - name: Audit source configuration and package metadata
        run: python3 scripts/audit-source.py

      - name: Install QPM CLI
        env:
          QPM_VERSION: v1.5.12
        run: |
          curl -fsSL "https://github.com/QuestPackageManager/QPM.CLI/releases/download/${QPM_VERSION}/qpm-linux-x64.zip" -o "$RUNNER_TEMP/qpm.zip"
          mkdir -p "$RUNNER_TEMP/qpm"
          unzip -q "$RUNNER_TEMP/qpm.zip" -d "$RUNNER_TEMP/qpm"
          QPM_BIN="$(find "$RUNNER_TEMP/qpm" -type f -name qpm | head -n 1)"
          test -n "$QPM_BIN"
          chmod +x "$QPM_BIN"
          sudo install "$QPM_BIN" /usr/local/bin/qpm
          qpm --version

      - name: Resolve Android NDK
        run: qpm ndk resolve -d

      - name: Restore QPM dependencies
        run: qpm restore

      - name: Generate QMOD manifest
        run: qpm qmod manifest

      - name: Validate manifest assets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("mod.json").read_text(encoding="utf-8"))
          if manifest.get("id") != "halloween":
              raise SystemExit("Unexpected mod id")
          if manifest.get("version") != "1.0.1":
              raise SystemExit("Unexpected v1.0.1 package version")
          if manifest.get("packageVersion") != "1.40.8_7379":
              raise SystemExit("Manifest no longer targets Beat Saber 1.40.8_7379")
          if manifest.get("modFiles") != ["libhalloween.so"]:
              raise SystemExit("Unexpected Halloween library declaration")
          if not Path(manifest["coverImage"]).is_file():
              raise SystemExit("Cover image is missing")
          for entry in manifest.get("fileCopies", []):
              asset = Path("FileCopies") / Path(entry["name"]).name
              if not asset.is_file():
                  raise SystemExit(f"Missing fileCopies asset: {asset}")
          print("Halloween manifest and source assets validated.")
          PY

      - name: Configure Android build
        run: |
          NDK_TOOLCHAIN="$(find "$HOME/.local/share/QPM-RS/ndk" -path '*/build/cmake/android.toolchain.cmake' -print -quit)"
          test -n "$NDK_TOOLCHAIN"
          NDK_ROOT="${NDK_TOOLCHAIN%/build/cmake/android.toolchain.cmake}"
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compile Halloween mod
        run: |
          cmake --build build --parallel
          test -s build/libhalloween.so

      - name: Build and package QMOD
        run: |
          qpm qmod zip --import mod.json --skip_build
          test -s Halloween.qmod
          cp Halloween.qmod Halloween-Theme.qmod

      - name: Validate QMOD archive contents
        run: |
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          with zipfile.ZipFile("Halloween-Theme.qmod") as archive:
              names = set(archive.namelist())
              if "mod.json" not in names:
                  raise SystemExit("QMOD is missing mod.json")
              manifest = json.loads(archive.read("mod.json"))
              if manifest.get("id") != "halloween":
                  raise SystemExit("Unexpected packaged mod id")
              if manifest.get("version") != "1.0.1":
                  raise SystemExit("Unexpected packaged version")
              if manifest.get("packageVersion") != "1.40.8_7379":
                  raise SystemExit("Packaged manifest no longer targets Beat Saber 1.40.8_7379")
              if "libhalloween.so" not in names:
                  raise SystemExit("QMOD is missing libhalloween.so")
              cover = manifest.get("coverImage")
              if cover and cover not in names:
                  raise SystemExit(f"QMOD is missing cover image: {cover}")
              expected_files = {
                  "Ghostly_Horror_Menu.ogg",
                  "ghost_ogrebane.ogg", "ghost_scary_1.ogg", "ghost_breath.ogg",
                  "ghost_pixabay_creepy.ogg", "ghost_pixabay_wind.ogg",
                  "GHOST_AUDIO_CREDITS.txt", "PIXABAY_AUDIO_CREDITS.txt",
                  "ghost_extra_0.png", "ghost_extra_1.png",
                  "ghost_extra_2.png", "ghost_extra_3.png"
              }
              copied = {Path(item["name"]).name for item in manifest.get("fileCopies", [])}
              if copied != expected_files:
                  raise SystemExit(f"Unexpected fileCopies: {sorted(copied)}")
              if not expected_files.issubset(names):
                  raise SystemExit(f"Missing packaged assets: {sorted(expected_files - names)}")
              for name in expected_files:
                  data = archive.read(name)
                  if len(data) < 100:
                      raise SystemExit(f"Invalid asset: {name}")
                  if name.endswith(".ogg") and not data.startswith(b"OggS"):
                      raise SystemExit(f"Invalid OGG: {name}")
                  if name.endswith(".png") and not data.startswith(b"\x89PNG\r\n\x1a\n"):
                      raise SystemExit(f"Invalid PNG: {name}")
          print("QMOD validated: v1.0.1, Beat Saber 1.40.8, 12 ghost designs, five sounds and credits.")
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Halloween-QMOD
          path: Halloween-Theme.qmod
          if-no-files-found: error

  publish_v101:
    name: Publish v1.0.1 on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify intended release and no previous published tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          qpm = json.loads(Path("qpm.json").read_text())
          manifest = json.loads(Path("mod.template.json").read_text())
          assert qpm["info"]["version"] == manifest["version"] == "1.0.1"
          assert manifest["packageVersion"] == "1.40.8_7379"
          PY
          if gh release view v1.0.1 >/dev/null 2>&1; then
            echo "Release v1.0.1 is already published; refusing to overwrite."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v1.0.1"; then
            echo "Tag v1.0.1 exists without a release; refusing to move it."
            exit 1
          fi

      - name: Download exact QMOD artifact from this workflow
        uses: actions/download-artifact@v4
        with:
          name: Halloween-QMOD
          path: dist

      - name: Verify release package and source
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("dist/Halloween-Theme.qmod") as package:
              assert package.testzip() is None
              m = json.loads(package.read("mod.json"))
              assert m["version"] == "1.0.1"
              assert m["packageVersion"] == "1.40.8_7379"
              assert len([p for p in package.namelist() if p.startswith("ghost_extra_") and p.endswith(".png")]) == 4
              for name in ("ghost_ogrebane.ogg", "ghost_scary_1.ogg", "ghost_breath.ogg",
                           "ghost_pixabay_creepy.ogg", "ghost_pixabay_wind.ogg",
                           "GHOST_AUDIO_CREDITS.txt", "PIXABAY_AUDIO_CREDITS.txt"):
                  assert name in package.namelist(), name
          for name in [f"FileCopies/ghost_extra_{i}.png" for i in range(4)]:
              assert Path(name).is_file()
          PY
          git archive --format=zip --prefix=Halloween-Theme/ HEAD -o dist/Halloween-Theme-GitHub-Source.zip
          sha256sum dist/Halloween-Theme.qmod dist/Halloween-Theme-GitHub-Source.zip

      - name: Publish verified GitHub Release v1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.1 \
            dist/Halloween-Theme.qmod \
            dist/Halloween-Theme-GitHub-Source.zip \
            --target "$GITHUB_SHA" \
            --title "Halloween Theme v1.0.1 for Beat Saber 1.40.8" \
            --notes-file RELEASE_NOTES_v1.0.1.md \
            --latest

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download QMOD artifact
        uses: actions/download-artifact@v4
        with:
          name: Halloween-QMOD
          path: dist

      - name: Validate release tag against packaged manifest
        run: |
          python3 - <<'PY'
          import json
          import os
          import zipfile
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag.removeprefix("v")
          with zipfile.ZipFile("dist/Halloween-Theme.qmod") as archive:
              manifest = json.loads(archive.read("mod.json"))
          actual = manifest.get("version")
          if actual != expected:
              raise SystemExit(f"Tag {tag} does not match QMOD version {actual}")
          print(f"Release version validated: {actual}")
          PY

      - name: Create source archive
        run: git archive --format=zip --prefix=Halloween-Theme/ HEAD -o dist/Halloween-Theme-GitHub-Source.zip

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Halloween Theme ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Halloween-Theme.qmod
            dist/Halloween-Theme-GitHub-Source.zip
