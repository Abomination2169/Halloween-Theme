name: Build Halloween QMOD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate Quest package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip curl python3

      - name: Install QPM CLI
        env:
          QPM_VERSION: v1.5.12
        run: |
          curl -fsSL "https://github.com/QuestPackageManager/QPM.CLI/releases/download/${QPM_VERSION}/qpm-linux-x64.zip" -o "$RUNNER_TEMP/qpm.zip"
          mkdir -p "$RUNNER_TEMP/qpm"
          unzip -q "$RUNNER_TEMP/qpm.zip" -d "$RUNNER_TEMP/qpm"
          QPM_BIN="$(find "$RUNNER_TEMP/qpm" -type f -name qpm | head -n 1)"
          test -n "$QPM_BIN"
          chmod +x "$QPM_BIN"
          sudo install "$QPM_BIN" /usr/local/bin/qpm
          qpm --version

      - name: Resolve Android NDK
        run: qpm ndk resolve -d

      - name: Restore QPM dependencies
        run: qpm restore

      - name: Generate QMOD manifest
        run: qpm qmod manifest

      - name: Validate manifest assets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("mod.json").read_text(encoding="utf-8"))
          if manifest.get("id") != "halloween":
              raise SystemExit("Unexpected mod id")
          if manifest.get("packageVersion") != "1.40.8_7379":
              raise SystemExit("Manifest no longer targets Beat Saber 1.40.8_7379")
          if manifest.get("modFiles") != ["libhalloween.so"]:
              raise SystemExit("Unexpected Halloween library declaration")
          if not Path(manifest["coverImage"]).is_file():
              raise SystemExit("Cover image is missing")
          for entry in manifest.get("fileCopies", []):
              asset = Path("FileCopies") / Path(entry["name"]).name
              if not asset.is_file():
                  raise SystemExit(f"Missing fileCopies asset: {asset}")
          print("Halloween manifest and source assets validated.")
          PY

      - name: Configure Android build
        run: |
          NDK_TOOLCHAIN="$(find "$HOME/.local/share/QPM-RS/ndk" -path '*/build/cmake/android.toolchain.cmake' -print -quit)"
          test -n "$NDK_TOOLCHAIN"
          NDK_ROOT="${NDK_TOOLCHAIN%/build/cmake/android.toolchain.cmake}"
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compile Halloween mod
        run: |
          cmake --build build --parallel
          test -s build/libhalloween.so

      - name: Build and package QMOD
        run: |
          qpm qmod zip --import mod.json --skip_build
          test -s Halloween.qmod
          cp Halloween.qmod Halloween-Theme.qmod

      - name: Validate QMOD archive contents
        run: |
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          with zipfile.ZipFile("Halloween-Theme.qmod") as archive:
              names = set(archive.namelist())
              if "mod.json" not in names:
                  raise SystemExit("QMOD is missing mod.json")
              manifest = json.loads(archive.read("mod.json"))
              if manifest.get("id") != "halloween":
                  raise SystemExit("Unexpected packaged mod id")
              if manifest.get("packageVersion") != "1.40.8_7379":
                  raise SystemExit("Packaged manifest no longer targets Beat Saber 1.40.8_7379")
              if "libhalloween.so" not in names:
                  raise SystemExit("QMOD is missing libhalloween.so")
              cover = manifest.get("coverImage")
              if cover and cover not in names:
                  raise SystemExit(f"QMOD is missing cover image: {cover}")
              expected_audio = {"Ghostly_Horror_Menu.ogg"}
              actual_audio = {Path(item["name"]).name for item in manifest.get("fileCopies", [])}
              if actual_audio != expected_audio:
                  raise SystemExit(f"Unexpected audio fileCopies: {sorted(actual_audio)}")
              if not expected_audio.issubset(names):
                  raise SystemExit("QMOD is missing Ghostly_Horror_Menu.ogg")
          print("QMOD validated: 1.40.8 manifest, library, cover, and menu audio.")
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Halloween-QMOD
          path: Halloween-Theme.qmod
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download QMOD artifact
        uses: actions/download-artifact@v4
        with:
          name: Halloween-QMOD
          path: dist

      - name: Validate release tag against packaged manifest
        run: |
          python3 - <<'PY'
          import json
          import os
          import zipfile
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag.removeprefix("v")
          with zipfile.ZipFile("dist/Halloween-Theme.qmod") as archive:
              manifest = json.loads(archive.read("mod.json"))
          actual = manifest.get("version")
          if actual != expected:
              raise SystemExit(f"Tag {tag} does not match QMOD version {actual}")
          print(f"Release version validated: {actual}")
          PY

      - name: Create source archive
        run: git archive --format=zip --prefix=Halloween-Theme/ HEAD -o dist/Halloween-Theme-GitHub-Source.zip

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Halloween Theme ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Halloween-Theme.qmod
            dist/Halloween-Theme-GitHub-Source.zip
